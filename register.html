<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - NGO Management System</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-50">

    <div class="min-h-screen flex items-center justify-center px-5 py-10">

        <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8">

            <div class="text-center mb-8">

                <div class="logo-box mx-auto mb-4">
                    NGO
                </div>

                <h1 class="text-2xl font-bold text-gray-800">
                    Create Account
                </h1>

                <p class="text-gray-500 mt-2">
                    Register as NGO User/Staff
                </p>

            </div>


            <form id="registerForm">

                <div class="mb-4">
                    <label class="form-label">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        class="form-input"
                        placeholder="Enter your full name"
                        required>
                </div>


                <div class="mb-4">
                    <label class="form-label">Email</label>

                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="Enter your email"
                        required>
                </div>


                <div class="mb-4">
                    <label class="form-label">Password</label>

                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Create a password"
                        required>
                </div>


                <div class="mb-5">
                    <label class="form-label">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-input"
                        placeholder="Confirm your password"
                        required>
                </div>


                <div class="bg-blue-50 text-blue-700 p-3 rounded-lg text-sm mb-5">
                    New accounts are registered as User/Staff.
                    Admin accounts are created separately.
                </div>


                <div id="registerError"
                     class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-5 text-sm">
                </div>


                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
                    Create Account
                </button>

            </form>


            <p class="text-center text-gray-500 mt-6 text-sm">
                Already have an account?

                <a href="login.html"
                   class="text-blue-600 font-medium hover:underline">
                    Login
                </a>
            </p>

        </div>

    </div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
